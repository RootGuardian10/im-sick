<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>я заболел</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: sans-serif;
            background: linear-gradient(135deg, #d0d0d0, #f5f5f5);
            background-size: 200% 200%;
            animation: move 4s ease infinite alternate;
            padding: 20px;
            box-sizing: border-box;
        }

        @keyframes move {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        img {
            max-width: 100%;
            height: auto;
            width: 280px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: clamp(32px, 10vw, 48px);
            color: #444;
            text-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin: 15px 0 0;
        }

        @media (max-width: 400px) {
            img {
                width: 220px;
            }
        }
    </style>
</head>
<body>
    <div>
        <img src="boy_kisser.jpg" alt="boy_kisser">
        <h1>я заболел</h1>
    </div>
</body>
</html>
